spring.application.name=workoutTracker

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/workout_tracker}
spring.datasource.username=${DB_USERNAME:workout_tracker}
spring.datasource.password=${DB_PASSWORD:workout_tracker}

# Schema is owned by Flyway; Hibernate only checks the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
